services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: gridguard-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridguard_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gridguard}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridguard} -d ${POSTGRES_DB:-gridguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: gridguard-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridguard-api
    depends_on:
      pgvector:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://gridguard:gridguard_dev@pgvector:5432/gridguard
      GRIDGUARD_SALT: ${GRIDGUARD_SALT:-gridguard-uk-dev-salt}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    command: ["uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgvector_data:
  mlflow_data:
