[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguard-uk"
version = "0.1.0"
description = "UK residential energy retrofit intelligence, spatial fuel poverty analytics, conformal EPC prediction, and Ofgem-compliant LangGraph advisory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "lightgbm>=4.5.0",
    "mapie>=0.9.0",
    "mlflow>=2.17.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]
ui = [
    "streamlit>=1.39.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
